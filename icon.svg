<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffe6f2"/>
      <stop offset="50%" style="stop-color:#f3e8ff"/>
      <stop offset="100%" style="stop-color:#e4fbf7"/>
    </linearGradient>
    <linearGradient id="pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff75ad"/>
      <stop offset="100%" style="stop-color:#b589ff"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="180" height="180" rx="40" fill="url(#bg)"/>
  <rect x="6" y="6" width="168" height="168" rx="35" fill="none" stroke="#ffb3d1" stroke-width="4"/>

  <!-- Robot Antenna -->
  <rect x="86" y="20" width="8" height="22" rx="4" fill="url(#pink)"/>
  <circle cx="90" cy="17" r="9" fill="#5ce1e6" stroke="#ffffff" stroke-width="2.5"/>

  <!-- Side Bolts -->
  <rect x="35" y="62" width="10" height="26" rx="5" fill="#ff9ebb" stroke="#ff75ad" stroke-width="2"/>
  <rect x="135" y="62" width="10" height="26" rx="5" fill="#ff9ebb" stroke="#ff75ad" stroke-width="2"/>

  <!-- Robot Head -->
  <rect x="44" y="42" width="92" height="68" rx="22" fill="#ffffff" stroke="#ff9ec4" stroke-width="4"/>

  <!-- Robot Screen -->
  <rect x="52" y="50" width="76" height="52" rx="14" fill="#251b3d" stroke="#d7c2ff" stroke-width="2"/>

  <!-- Glowing Eyes -->
  <circle cx="74" cy="72" r="8" fill="#5ce1e6"/>
  <circle cx="71.5" cy="69.5" r="2.8" fill="#ffffff"/>
  <circle cx="106" cy="72" r="8" fill="#5ce1e6"/>
  <circle cx="103.5" cy="69.5" r="2.8" fill="#ffffff"/>

  <!-- Blush Cheeks -->
  <ellipse cx="62" cy="83" rx="6.5" ry="3.5" fill="#ff7eb3" opacity="0.9"/>
  <ellipse cx="118" cy="83" rx="6.5" ry="3.5" fill="#ff7eb3" opacity="0.9"/>

  <!-- Cute Robot Smile -->
  <path d="M81 84 Q90 93 99 84" fill="none" stroke="#ff7eb3" stroke-width="3" stroke-linecap="round"/>

  <!-- Division Symbol -->
  <text x="90" y="152" text-anchor="middle" font-family="Arial Rounded MT Bold, Arial Black, sans-serif" font-size="48" font-weight="bold" fill="url(#pink)">÷</text>

  <!-- Sparkles -->
  <text x="24" y="48" font-size="18">⚡</text>
  <text x="140" y="148" font-size="18">✨</text>
</svg>
